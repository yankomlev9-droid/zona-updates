name: Move Zona Easter Egg video to zona-media

on:
  push:
    paths:
      - '.github/workflows/zona-media-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zona-media-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Verify and migrate video asset
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_TAG: v0.56.60
      MEDIA_TAG: zona-media
      VIDEO_NAME: 1_prob4.mp4
      EXPECTED_SHA256: b2453aa80afe3ce7e77423b7fb613930f40e01b1f861011754cf77266a6eebf5
      EXPECTED_SIZE: '1261031556'
    steps:
      - name: Copy and verify video; remove old asset only after successful verification
        shell: bash
        run: |
          set -euo pipefail

          target_digest="$(gh api "repos/$GH_REPO/releases/tags/$MEDIA_TAG" --jq '.assets[] | select(.name == "1_prob4.mp4") | .digest' 2>/dev/null || true)"
          if [[ "$target_digest" == "sha256:$EXPECTED_SHA256" ]]; then
            echo "Already migrated: matching asset found in $MEDIA_TAG"
          else
            if [[ -n "$target_digest" ]]; then
              echo "::error::Target video asset exists with unexpected SHA-256 ($target_digest)"
              exit 1
            fi

            source_digest="$(gh api "repos/$GH_REPO/releases/tags/$SOURCE_TAG" --jq '.assets[] | select(.name == "1_prob4.mp4") | .digest')"
            source_size="$(gh api "repos/$GH_REPO/releases/tags/$SOURCE_TAG" --jq '.assets[] | select(.name == "1_prob4.mp4") | .size')"
            if [[ "$source_digest" != "sha256:$EXPECTED_SHA256" || "$source_size" != "$EXPECTED_SIZE" ]]; then
              echo "::error::Source video missing or SHA-256/size unexpectedly changed"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/zona-media"
            gh release download "$SOURCE_TAG" --repo "$GH_REPO" --pattern "$VIDEO_NAME" --dir "$RUNNER_TEMP/zona-media"
            local_file="$RUNNER_TEMP/zona-media/$VIDEO_NAME"
            echo "$EXPECTED_SHA256  $local_file" | sha256sum --check --status
            echo "Downloaded file matches original SHA-256"

            if gh release view "$MEDIA_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$MEDIA_TAG" "$local_file" --repo "$GH_REPO"
            else
              gh release create "$MEDIA_TAG" "$local_file" --repo "$GH_REPO" \
                --title "Zona Media — пасхалки" \
                --notes "Дополнительные материалы для Zona/Lampa. Этот релиз не является обновлением программы. Файл 1_prob4.mp4 используется для секретной видеопасхалки и не входит в установщик Zona." \
                --target "$GITHUB_SHA" \
                --prerelease \
                --latest=false
            fi
          fi

          verified="false"
          for i in $(seq 1 20); do
            target_digest="$(gh api "repos/$GH_REPO/releases/tags/$MEDIA_TAG" --jq '.assets[] | select(.name == "1_prob4.mp4") | .digest' 2>/dev/null || true)"
            target_size="$(gh api "repos/$GH_REPO/releases/tags/$MEDIA_TAG" --jq '.assets[] | select(.name == "1_prob4.mp4") | .size' 2>/dev/null || true)"
            if [[ "$target_digest" == "sha256:$EXPECTED_SHA256" && "$target_size" == "$EXPECTED_SIZE" ]]; then
              verified="true"
              break
            fi
            sleep 3
          done
          if [[ "$verified" != "true" ]]; then
            echo "::error::New asset was not verified; original release asset remains untouched"
            exit 1
          fi
          echo "New zona-media asset verified (SHA-256 and size)"

          is_prerelease="$(gh api "repos/$GH_REPO/releases/tags/$MEDIA_TAG" --jq '.prerelease')"
          if [[ "$is_prerelease" != "true" ]]; then
            echo "::error::zona-media must remain a prerelease to protect the Zona updater"
            exit 1
          fi

          old_asset="$(gh api "repos/$GH_REPO/releases/tags/$SOURCE_TAG" --jq '.assets[] | select(.name == "1_prob4.mp4") | .id')"
          if [[ -n "$old_asset" ]]; then
            gh release delete-asset "$SOURCE_TAG" "$VIDEO_NAME" --repo "$GH_REPO" --yes
            echo "Removed original asset only after verifying the separate release"
          fi
          echo "Migration complete: https://github.com/$GH_REPO/releases/download/$MEDIA_TAG/$VIDEO_NAME"
