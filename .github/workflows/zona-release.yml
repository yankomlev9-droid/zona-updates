name: Publish Zona update

# Preferred: upload one Zona_X.Y.Z_PUBLISH.zip to the repository root.
# That outer ZIP contains: Zona_X.Y.Z_GITHUB_UPDATE_4_FILES.zip and RELEASE_NOTES.md.
# Legacy four-file archives + release-notes/vX.Y.Z.md remain supported.
on:
  push:
    paths:
      - 'Zona_*_PUBLISH.zip'
      - 'Zona_*_GITHUB_UPDATE_4_FILES.zip'
  workflow_dispatch:
    inputs:
      archive:
        description: 'Exact ZIP filename in repository root (e.g. Zona_0.56.13_PUBLISH.zip)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: zona-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify Zona ZIP and create release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and unpack publish package
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ARCHIVE_INPUT: ${{ inputs.archive }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import io
          import os
          import re
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          package_re = re.compile(r'^Zona_(\d+\.\d+\.\d+)_PUBLISH\.zip$')
          update_re = re.compile(r'^Zona_(\d+\.\d+\.\d+)_GITHUB_UPDATE_4_FILES\.zip$')
          expected = {'Zona.exe', 'OPEN_SETTINGS.cmd', 'OPEN_SEARCH_TEST.cmd', 'README.txt'}

          def fail(message):
              sys.exit(f'ERROR: {message}')

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              filename = os.environ.get('ARCHIVE_INPUT', '').strip()
          else:
              before = os.environ.get('BEFORE_SHA', '').strip()
              after = os.environ['AFTER_SHA'].strip()
              if before and before != '0' * 40:
                  cmd = ['git', 'diff', '--name-only', '--diff-filter=AM', before, after]
              else:
                  cmd = ['git', 'show', '--pretty=format:', '--name-only', after]
              try:
                  changed = subprocess.check_output(cmd, text=True).splitlines()
              except subprocess.CalledProcessError as exc:
                  fail(f'Cannot inspect commit: {exc}')
              matches = sorted(p for p in changed if package_re.fullmatch(p) or update_re.fullmatch(p))
              if len(matches) != 1:
                  fail(f'Expected one Zona ZIP uploaded to the repository root; found {matches}. For an existing ZIP use Actions > Run workflow.')
              filename = matches[0]

          package_match = package_re.fullmatch(filename)
          update_match = update_re.fullmatch(filename)
          if not package_match and not update_match:
              fail(f'Unexpected ZIP name: {filename}. Use Zona_X.Y.Z_PUBLISH.zip')
          version = (package_match or update_match).group(1)
          source = Path(filename)
          if not source.is_file() or source.stat().st_size > 100 * 1024 * 1024:
              fail('ZIP missing or larger than 100 MiB')

          if package_match:
              expected_update_name = f'Zona_{version}_GITHUB_UPDATE_4_FILES.zip'
              with zipfile.ZipFile(source) as outer:
                  names = outer.namelist()
                  if len(names) != 2 or set(names) != {expected_update_name, 'RELEASE_NOTES.md'}:
                      fail(f'Publish package must contain only {expected_update_name} and RELEASE_NOTES.md, at ZIP root. Found: {names}')
                  if outer.testzip() is not None:
                      fail('Publish ZIP failed integrity check')
                  if outer.getinfo(expected_update_name).file_size > 100 * 1024 * 1024:
                      fail('Inner updater ZIP is too large')
                  if outer.getinfo('RELEASE_NOTES.md').file_size > 1024 * 1024:
                      fail('Release notes file is too large')
                  update_data = outer.read(expected_update_name)
                  try:
                      notes_text = outer.read('RELEASE_NOTES.md').decode('utf-8-sig')
                  except UnicodeDecodeError:
                      fail('Release notes must be UTF-8')
          else:
              expected_update_name = filename
              update_data = source.read_bytes()
              notes_path = Path('release-notes') / f'v{version}.md'
              if not notes_path.is_file():
                  fail(f'Legacy release notes missing: {notes_path}')
              notes_text = notes_path.read_text(encoding='utf-8-sig')

          if not notes_text.strip():
              fail('Release notes cannot be empty')
          try:
              with zipfile.ZipFile(io.BytesIO(update_data)) as inner:
                  names = inner.namelist()
                  if len(names) != 4 or set(names) != expected:
                      fail(f'Updater ZIP must have exactly four files at ZIP root. Found: {names}')
                  if any(x.file_size > 100 * 1024 * 1024 for x in inner.infolist()):
                      fail('One of the updater files is too large')
                  if inner.testzip() is not None:
                      fail('Updater ZIP failed integrity check')
                  if inner.read('Zona.exe')[:2] != b'MZ':
                      fail('Zona.exe is not a Windows PE executable')
                  readme = inner.read('README.txt').decode('utf-8-sig', errors='replace')
                  if version not in readme:
                      fail(f'README.txt does not mention version {version}')
          except zipfile.BadZipFile:
              fail('Inner updater file is not a ZIP archive')

          destination = Path(os.environ['RUNNER_TEMP']) / 'zona_publish'
          destination.mkdir(parents=True, exist_ok=True)
          out_zip = destination / expected_update_name
          out_notes = destination / 'RELEASE_NOTES.md'
          out_zip.write_bytes(update_data)
          out_notes.write_text(notes_text, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'file={out_zip}\n')
              out.write(f'notes={out_notes}\n')
              out.write(f'version={version}\n')
              out.write(f'tag=v{version}\n')
          print(f'Validated Zona {version}; prepared update ZIP and release notes')
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.validate.outputs.file }}
          NOTES: ${{ steps.validate.outputs.notes }}
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" "$FILE" \
            --title "Zona $VERSION" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
          echo "Published $TAG with $FILE"
