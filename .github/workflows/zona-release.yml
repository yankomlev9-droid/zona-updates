name: Publish Zona update

# Upload a new 4-file Zona ZIP into the root of the repository.
# The workflow validates it and publishes a GitHub Release automatically.
on:
  push:
    paths:
      - 'Zona_*_GITHUB_UPDATE_4_FILES.zip'
  workflow_dispatch:
    inputs:
      archive:
        description: 'Exact ZIP filename in the repository root (e.g. Zona_0.56.11_GITHUB_UPDATE_4_FILES.zip)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: zona-release
  cancel-in-progress: false

jobs:
  release:
    name: Check ZIP and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the archive and release notes
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ARCHIVE_INPUT: ${{ inputs.archive }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          filename_pattern = re.compile(r'^Zona_(\d+\.\d+\.\d+)_GITHUB_UPDATE_4_FILES\.zip$')
          expected = {'Zona.exe', 'OPEN_SETTINGS.cmd', 'OPEN_SEARCH_TEST.cmd', 'README.txt'}

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              filename = os.environ.get('ARCHIVE_INPUT', '').strip()
          else:
              # The push payload's `commits` list can be empty even after a web upload.
              # Read the changed paths from Git itself instead of trusting that list.
              before = os.environ.get('BEFORE_SHA', '').strip()
              after = os.environ['AFTER_SHA'].strip()
              if before and before != '0' * 40:
                  cmd = ['git', 'diff', '--name-only', '--diff-filter=AM', before, after]
              else:
                  cmd = ['git', 'show', '--pretty=format:', '--name-only', after]
              try:
                  changed = subprocess.check_output(cmd, text=True).splitlines()
              except subprocess.CalledProcessError as exc:
                  sys.exit(f'Unable to inspect pushed files: {exc}')
              matches = sorted(name for name in changed if filename_pattern.fullmatch(name))
              if len(matches) != 1:
                  sys.exit(f'Expected exactly one uploaded Zona ZIP. Found: {matches}. For an existing ZIP, use Actions -> Run workflow.')
              filename = matches[0]

          match = filename_pattern.fullmatch(filename)
          if not match:
              sys.exit(f'Invalid archive name: {filename!r}. Expected Zona_X.Y.Z_GITHUB_UPDATE_4_FILES.zip')
          version = match.group(1)
          path = Path(filename)
          if not path.is_file():
              sys.exit(f'Archive not found in repository root: {filename}')
          if path.stat().st_size > 100 * 1024 * 1024:
              sys.exit('Archive exceeds 100 MiB: check that you uploaded the compact 4-file version.')

          try:
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  if len(names) != 4 or set(names) != expected:
                      sys.exit(f'ZIP must contain exactly {sorted(expected)} at its root. Found: {names}')
                  bad = z.testzip()
                  if bad is not None:
                      sys.exit(f'ZIP integrity check failed for: {bad}')
                  if z.read('Zona.exe')[:2] != b'MZ':
                      sys.exit('Zona.exe does not look like a Windows executable.')
                  readme = z.read('README.txt').decode('utf-8-sig', errors='replace')
                  if version not in readme:
                      sys.exit('ZIP README.txt does not contain the version from the filename.')
          except (OSError, zipfile.BadZipFile) as exc:
              sys.exit(f'Cannot read ZIP: {exc}')

          notes = Path('release-notes') / f'v{version}.md'
          if not notes.is_file() or not notes.read_text(encoding='utf-8').strip():
              sys.exit(f'User-friendly release notes missing: {notes}. Create them before uploading the ZIP.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'filename={filename}\n')
              out.write(f'version={version}\n')
              out.write(f'tag=v{version}\n')
              out.write(f'notes={notes.as_posix()}\n')
          print(f'ZIP OK: {filename}; release notes OK: {notes}')
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.validate.outputs.filename }}
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
          NOTES: ${{ steps.validate.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; it will not be overwritten automatically."
            exit 1
          fi
          gh release create "$TAG" "$FILE" \
            --title "Zona $VERSION" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
          echo "Published $TAG with asset $FILE"
